services:
  db:
    image: postgres:16-alpine
    container_name: mekong_mobile_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mekong_mobile}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mekong_local_dev}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - mekong_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mekong_mobile}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mekong_pgdata:
